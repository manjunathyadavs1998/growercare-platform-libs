# SPEC-PLAT-02 R28: weekly, grouped updates with Conventional-Commit titles (repo kit).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build", include: scope }
    labels: [dependencies, backend]
    registries: [github-packages]
    groups:
      platform:
        patterns: ["com.growercare*"]
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
      other:
        patterns: ["*"]
        exclude-patterns: ["com.growercare*", "org.springframework*", "org.springdoc*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci" }
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

registries:
  github-packages:
    type: maven-repository
    url: https://maven.pkg.github.com/manjunathyadavs1998/growercare-platform-libs
    username: x-access-token
    password: ${{ secrets.PACKAGES_READ_TOKEN }}
